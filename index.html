<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 图片生成器</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080c;--side:#0e0e16;--surface:#14141e;--surface2:#1c1c2a;--surface3:#262636;
  --border:#2a2a3c;--border-h:#3a3a52;
  --text:#eeeef4;--text2:#9898b0;--text3:#585868;
  --pri:#7c6aef;--pri-l:#a78bfa;--pri-d:#6354d4;
  --ok:#22c55e;--warn:#f59e0b;--err:#ef4444;
  --r:10px;--rs:6px;
  --t:all .15s ease;
}
html{font-size:14px}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input,textarea,select{font-family:inherit;outline:none}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.app{display:grid;grid-template-columns:240px 1fr;height:100vh}

/* Sidebar */
.sb{background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sb-h{padding:16px 18px;border-bottom:1px solid var(--border)}
.sb-h h1{font-size:1.1rem;font-weight:700;background:linear-gradient(135deg,var(--pri-l),#c4b5fd);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sb-actions{padding:8px 10px;display:flex;gap:6px;border-bottom:1px solid var(--border)}
.btn-new{flex:1;padding:8px;background:var(--pri);color:#fff;border-radius:var(--rs);font-size:.78rem;font-weight:600;transition:var(--t);display:flex;align-items:center;justify-content:center;gap:4px}
.btn-new:hover{background:var(--pri-l)}
.btn-set{padding:8px 10px;background:var(--surface);color:var(--text2);border-radius:var(--rs);transition:var(--t);font-size:.9rem}
.btn-set:hover{background:var(--surface2);color:var(--text)}
.tl{flex:1;overflow-y:auto;padding:6px}
.ti{padding:8px 10px;border-radius:var(--rs);cursor:pointer;transition:var(--t);margin-bottom:2px;border:1px solid transparent;display:flex;align-items:center;gap:8px}
.ti:hover{background:var(--surface)}
.ti.act{background:var(--surface);border-color:var(--pri)}
.ti-thumb{width:32px;height:32px;border-radius:4px;overflow:hidden;flex-shrink:0;background:var(--surface2)}
.ti-thumb img{width:100%;height:100%;object-fit:cover}
.ti-thumb .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:.7rem}
.ti-info{flex:1;min-width:0}
.ti-title{font-weight:600;font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ti-time{font-size:.62rem;color:var(--text3);margin-top:2px}
.ti .del-btn{width:18px;height:18px;border-radius:50%;background:rgba(239,68,68,.15);color:var(--err);font-size:.6rem;display:none;align-items:center;justify-content:center;flex-shrink:0}
.ti:hover .del-btn{display:flex}

/* Chat Area */
.chat{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.chat-h{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.chat-h h2{font-size:.95rem;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-h .acts{display:flex;gap:6px}
.chat-h .acts .bs{padding:5px 10px;background:var(--surface);color:var(--text2);border-radius:var(--rs);font-size:.75rem;transition:var(--t)}
.chat-h .acts .bs:hover{background:var(--surface2);color:var(--text)}

.chat-body{flex:1;overflow-y:auto;padding:0 20px}
.chat-msg{padding:20px 0;border-bottom:1px solid var(--border)}
.chat-msg:last-child{border-bottom:none}
.msg-label{font-size:.72rem;color:var(--text3);margin-bottom:8px;font-weight:500;display:flex;align-items:center;gap:6px}
.msg-label .dot{width:6px;height:6px;border-radius:50%;background:var(--pri)}
.msg-prompt{font-size:.88rem;color:var(--text);line-height:1.6;margin-bottom:12px;white-space:pre-wrap}
.msg-refs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.msg-refs img{width:56px;height:56px;object-fit:cover;border-radius:var(--rs);border:1px solid var(--border)}
.msg-images{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.msg-images img{width:100%;border-radius:var(--r);display:block;object-fit:contain;background:var(--surface);max-height:480px;cursor:pointer;transition:var(--t)}
.msg-images img:hover{opacity:.9}
.msg-img-actions{display:flex;gap:4px;margin-top:8px}
.msg-img-actions .bs{padding:4px 8px;font-size:.7rem;background:var(--surface);color:var(--text2);border-radius:4px}
.msg-img-actions .bs:hover{background:var(--surface2);color:var(--text)}
.msg-error{color:var(--err);font-size:.82rem;background:rgba(239,68,68,.08);padding:10px 14px;border-radius:var(--rs);margin-top:8px}
.msg-loading{display:flex;align-items:center;gap:10px;padding:12px 0}
.msg-loading .spin{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--pri);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.msg-loading span{font-size:.82rem;color:var(--text2)}

/* Input Bar */
.input-bar{padding:14px 20px;border-top:1px solid var(--border);background:var(--side)}
.input-row{display:flex;gap:8px;align-items:flex-end}
.input-wrap{flex:1;display:flex;flex-direction:column;gap:6px}
.input-top{display:flex;gap:6px;align-items:center}
.input-top label{font-size:.72rem;color:var(--text3);cursor:pointer;display:flex;align-items:center;gap:4px;padding:5px 10px;background:var(--surface);border-radius:var(--rs);transition:var(--t)}
.input-top label:hover{background:var(--surface2)}
.input-top .img-preview{display:flex;gap:4px}
.input-top .img-preview img{width:36px;height:36px;object-fit:cover;border-radius:4px;border:1px solid var(--border)}
.input-top .img-preview .rm{position:relative;margin-left:-30px;margin-top:20px;width:16px;height:16px;border-radius:50%;background:rgba(0,0,0,.8);color:#fff;font-size:.55rem;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:1}
textarea.inp{width:100%;min-height:42px;max-height:120px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);color:var(--text);padding:10px 12px;font-size:.88rem;resize:none;line-height:1.5;transition:var(--t)}
textarea.inp:focus{border-color:var(--pri)}
textarea.inp::placeholder{color:var(--text3)}
.btn-send{padding:10px 20px;background:var(--pri);color:#fff;border-radius:var(--r);font-size:.88rem;font-weight:600;transition:var(--t);white-space:nowrap;min-height:42px}
.btn-send:hover{background:var(--pri-l)}
.btn-send:disabled{opacity:.4;cursor:not-allowed}
.input-bottom{display:flex;gap:8px;align-items:center;margin-top:6px}
.input-bottom select{background:var(--surface);border:1px solid var(--border);border-radius:4px;color:var(--text2);padding:3px 6px;font-size:.7rem}
.input-bottom span{font-size:.68rem;color:var(--text3)}

/* Modal */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:var(--t)}
.mo.a{opacity:1;pointer-events:auto}
.md{background:var(--surface);border:1px solid var(--border);border-radius:14px;width:440px;max-height:75vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.5);transform:translateY(16px);transition:var(--t)}
.mo.a .md{transform:translateY(0)}
.md-h{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.md-h h3{font-size:.95rem;font-weight:600}
.md-b{padding:16px 18px}
.sg{margin-bottom:12px}
.sg label{display:block;font-size:.78rem;color:var(--text2);margin-bottom:4px;font-weight:500}
.sg input,.sg select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);padding:8px 10px;font-size:.82rem}
.sg .hint{font-size:.68rem;color:var(--text3);margin-top:2px}
.md-f{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:6px}

/* Toast */
.tc{position:fixed;top:14px;right:14px;z-index:200;display:flex;flex-direction:column;gap:6px}
.tt{padding:9px 16px;border-radius:var(--rs);font-size:.8rem;animation:si .25s ease}
.tt.ok{background:var(--ok);color:#fff}.tt.er{background:var(--err);color:#fff}
@keyframes si{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* Lightbox */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:300;display:flex;align-items:center;justify-content:center;cursor:zoom-out;opacity:0;pointer-events:none;transition:var(--t)}
.lb.a{opacity:1;pointer-events:auto}
.lb img{max-width:90vw;max-height:90vh;object-fit:contain}

/* Empty */
.es{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;color:var(--text3);padding:40px}
.es .ei{font-size:3rem;margin-bottom:12px;opacity:.3}
.es p{font-size:.9rem}

@media(max-width:768px){.app{grid-template-columns:1fr}.sb{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sb">
  <div class="sb-h"><h1>AI 图片生成器</h1></div>
  <div class="sb-actions">
    <button class="btn-new" onclick="newTask()">+ 新对话</button>
    <button class="btn-set" onclick="openSet()">⚙️</button>
  </div>
  <div class="tl" id="tl"></div>
</aside>
<main class="chat" id="chatArea"></main>
</div>

<div class="mo" id="mo">
<div class="md">
  <div class="md-h"><h3>API 配置</h3><button class="btn-set" onclick="closeSet()" style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:1rem">×</button></div>
  <div class="md-b">
    <div class="sg"><label>API 地址</label><input id="sUrl" placeholder="https://lingyao.world"><div class="hint">聚合API地址</div></div>
    <div class="sg"><label>API Key</label><input id="sKey" type="password" placeholder="sk-xxx"><div class="hint">仅保存在本地</div></div>
    <div class="sg"><label>识图模型</label><select id="sVis"><option value="qwen3-vl-plus">Qwen3-VL-Plus</option><option value="qwen-vl-max-latest">Qwen-VL-Max</option></select></div>
    <div class="sg"><label>质量</label><select id="sQual"><option value="low">低（快）</option><option value="medium" selected>中</option><option value="high">高（精）</option></select></div>
  </div>
  <div class="md-f"><button class="btn-set" onclick="closeSet()" style="padding:8px 20px;color:var(--text2);font-size:.85rem">取消</button><button class="btn-new" onclick="saveSet()" style="padding:8px 20px;font-size:.85rem">保存</button></div>
</div>
</div>
<div class="tc" id="tc"></div>
<div class="lb" id="lb" onclick="this.classList.remove('a')"><img id="lbImg" src=""></div>

<script>
const RATIO = {'1:1':'1024x1024','3:4':'768x1024','4:3':'1024x768','9:16':'768x1344','16:9':'1344x768'};
const STYLE_PROMPT = `分析图片的视觉风格，精确描述：1.画面风格 2.配色方案 3.构图方式 4.光影效果 5.关键元素 6.整体氛围。用专业语言描述，让AI绘图能复现此风格。`;

const MAT_PROMPT = `分析这张图片中的视觉元素（人物、Logo、物体、文字等），详细描述其外观特征、颜色、形状、位置等。这些元素需要被融入新生成的图片中。请精确描述以便AI绘图能识别并还原这些元素。`;

const GEN_REQUIREMENTS = `

=== GENERATION REQUIREMENTS ===
You are a professional commercial image generator. Follow these rules strictly:

1. STYLE CONSISTENCY: Match the reference style EXACTLY - same art style, color palette, lighting mood, and composition approach. Do not deviate from the referenced aesthetic.

2. MATERIAL INTEGRATION: All referenced material elements (logos, characters, objects) must appear naturally in the composition at appropriate positions. They should be clearly recognizable and well-integrated into the scene, not awkwardly placed or distorted.

3. COMPOSITION: Use professional composition principles. Maintain visual hierarchy with a clear focal point. Ensure balanced layout and proper use of negative space.

4. QUALITY: Output must be commercial-grade quality - sharp details, accurate colors, professional lighting, no artifacts or distortions.

5. COHERENCE: All elements must work together harmoniously. The final image should look like a cohesive professional design, not a collage of separate elements.`;

let cfg = {apiBaseUrl:'https://lingyao.world', apiKey:'', visionModel:'qwen3-vl-plus', quality:'medium'};
let tasks = [];
let activeId = null;
let pendingRefs = [];
let pendingMats = [];

function load(){try{const c=localStorage.getItem('aic');if(c)cfg={...cfg,...JSON.parse(c)};const t=localStorage.getItem('ait');if(t)tasks=JSON.parse(t)}catch(e){}}
function sTasks(){try{localStorage.setItem('ait',JSON.stringify(tasks))}catch(e){}}
function sCfg(){try{localStorage.setItem('aic',JSON.stringify(cfg))}catch(e){}}
load();

// ===== API =====
async function apiChat(msgs, sig){
  const r = await fetch(cfg.apiBaseUrl.replace(/\/$/,'')+'/v1/chat/completions',{
    method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${cfg.apiKey}`},
    body:JSON.stringify({model:cfg.visionModel,messages:msgs,max_tokens:1200,temperature:0.7}),signal:sig
  });
  if(!r.ok) throw new Error(`识图失败(${r.status})`);
  return (await r.json()).choices[0].message.content;
}

async function apiImg(prompt, sig){
  const body = {model:'gpt-image-2', prompt, size:RATIO[cfg.ratio]||'1024x1024', quality:cfg.quality};
  const r = await fetch(cfg.apiBaseUrl.replace(/\/$/,'')+'/v1/images/generations',{
    method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${cfg.apiKey}`},
    body:JSON.stringify(body),signal:sig
  });
  if(!r.ok){const e=await r.text().catch(()=>'');throw new Error(`出图失败(${r.status}): ${e}`)}
  return (await r.json()).data||[];
}

async function analyze(b64, sig, type){
  const prompt = type==='mat' ? MAT_PROMPT : STYLE_PROMPT;
  const text = type==='mat' ? '请分析此图片中的元素。' : '请分析此图片的风格。';
  return apiChat([
    {role:'system',content:prompt},
    {role:'user',content:[{type:'image_url',image_url:{url:b64}},{type:'text',text}]}
  ],sig);
}

// ===== Tasks =====
function newTask(){
  const t = {id:String(Date.now()), title:'新对话', messages:[], createdAt:new Date().toISOString()};
  tasks.unshift(t); activeId=t.id; sTasks(); render();
}

function delTask(id){
  const t=tasks.find(x=>x.id===id);
  if(t?.abort) t.abort.abort();
  tasks=tasks.filter(x=>x.id!==id);
  if(activeId===id) activeId=tasks[0]?.id||null;
  sTasks(); render();
}

function getActive(){return tasks.find(t=>t.id===activeId)||null}

async function sendMessage(taskId, prompt, refs, mats){
  const t=tasks.find(x=>x.id===taskId);
  if(!t||t.generating)return;
  if(!prompt.trim()){toast('请输入提示词','er');return}
  if(!cfg.apiKey){toast('请先配置API Key','er');return}

  const ctrl = new AbortController();
  t.abort=ctrl;
  t.generating=true;

  const msg = {role:'user', prompt, refs:refs||[], mats:mats||[], timestamp:Date.now()};
  t.messages.push(msg);

  const aiMsg = {role:'ai', images:[], status:'loading', timestamp:Date.now()};
  t.messages.push(aiMsg);

  if(t.messages.length<=2) t.title = prompt.slice(0,24)+(prompt.length>24?'...':'');
  t.updatedAt = new Date().toISOString();
  sTasks(); render();

  try {
    let fullPrompt = prompt;

    // Analyze style references
    if(refs && refs.length){
      const styleParts = await Promise.all(refs.map(r=>analyze(r, ctrl.signal, 'style')));
      fullPrompt += '\n\n--- 风格参考 ---\n'+styleParts.map((p,i)=>`参考图${i+1}: ${p}`).join('\n\n');
    }

    // Analyze material elements
    if(mats && mats.length){
      const matParts = await Promise.all(mats.map(r=>analyze(r, ctrl.signal, 'mat')));
      fullPrompt += '\n\n--- 画面素材元素（需要出现在最终图片中）---\n'+matParts.map((p,i)=>`素材${i+1}: ${p}`).join('\n\n');
    }

    fullPrompt += GEN_REQUIREMENTS;

    const data = await apiImg(fullPrompt, ctrl.signal);
    const urls = data.map(x=>{
      if(x.b64_json&&x.b64_json.length>0) return `data:image/png;base64,${x.b64_json}`;
      if(x.url&&x.url.length>0) return x.url;
      return null;
    }).filter(Boolean);

    aiMsg.images = urls;
    aiMsg.status = urls.length?'done':'error';
    if(!urls.length) aiMsg.error = '未获取到图片';

  } catch(e){
    aiMsg.status = 'error';
    aiMsg.error = e.name==='AbortError'?'已取消':e.message;
  }

  t.generating = false;
  delete t.abort;
  t.updatedAt = new Date().toISOString();
  sTasks(); render();
}

// ===== Render =====
function render(){renderList();renderChat()}

function renderList(){
  const c=document.getElementById('tl');
  if(!tasks.length){c.innerHTML='<div class="es"><div class="ei">💬</div><p>暂无对话</p></div>';return}
  c.innerHTML=tasks.map(t=>{
    const thumb = getThumb(t);
    const tm = fmtTime(t.updatedAt||t.createdAt);
    return `<div class="ti ${t.id===activeId?'act':''}" onclick="pick('${t.id}')">
      <div class="ti-thumb">${thumb?`<img src="${thumb}">`:'<div class="ph"></div>'}</div>
      <div class="ti-info"><div class="ti-title">${esc(t.title)}</div><div class="ti-time">${tm}</div></div>
      <button class="del-btn" onclick="event.stopPropagation();delTask('${t.id}')" title="删除">×</button>
    </div>`;
  }).join('');
}

function getThumb(t){
  for(const m of t.messages){
    if(m.images&&m.images.length) return m.images[0];
  }
  return null;
}

function renderChat(){
  const area = document.getElementById('chatArea');
  const t = getActive();
  if(!t){
    area.innerHTML='<div class="es"><div class="ei"></div><p>选择或创建一个新对话开始</p></div>';
    return;
  }

  let msgs = t.messages.map((m,i)=>{
    if(m.role==='user'){
      return `<div class="chat-msg">
        <div class="msg-label"><span class="dot" style="background:var(--text3)"></span>你</div>
        <div class="msg-prompt">${esc(m.prompt)}</div>
        ${m.refs&&m.refs.length?`<div class="msg-refs"><span style="font-size:.65rem;color:var(--text3);margin-right:4px">风格参考:</span>${m.refs.map(r=>`<img src="${r}">`).join('')}</div>`:''}
        ${m.mats&&m.mats.length?`<div class="msg-refs"><span style="font-size:.65rem;color:var(--text3);margin-right:4px">素材:</span>${m.mats.map(r=>`<img src="${r}">`).join('')}</div>`:''}
      </div>`;
    }
    if(m.role==='ai'){
      if(m.status==='loading'){
        return `<div class="chat-msg"><div class="msg-label"><span class="dot"></span>AI 生成中</div>
          <div class="msg-loading"><div class="spin"></div><span>正在生成图片...</span></div></div>`;
      }
      if(m.status==='error'){
        return `<div class="chat-msg"><div class="msg-label"><span class="dot" style="background:var(--err)"></span>生成失败</div>
          <div class="msg-error">${esc(m.error||'未知错误')}</div></div>`;
      }
      return `<div class="chat-msg">
        <div class="msg-label"><span class="dot"></span>AI · ${m.images.length}张</div>
        <div class="msg-images">${m.images.map((u,j)=>`<div><img src="${u}" onclick="openLB('${u}')" loading="lazy"><div class="msg-img-actions"><button class="bs" onclick="dlImg('${u}','${i}_${j}')">💾 下载</button></div></div>`).join('')}</div>
      </div>`;
    }
    return '';
  }).join('');

  area.innerHTML = `
    <div class="chat-h"><h2>${esc(t.title)}</h2>
      <div class="acts"><button class="bs" onclick="delTask('${t.id}')">️ 删除</button></div>
    </div>
    <div class="chat-body" id="chatBody">${msgs}</div>
    <div class="input-bar">
      <div class="input-row">
        <div class="input-wrap">
          <div class="input-top">
            <label onclick="document.getElementById('inpRef').click()" title="风格参考图">🖼️ 参考图
              <input type="file" id="inpRef" accept="image/*" multiple style="display:none" onchange="onInpFile(this,'ref')">
            </label>
            <label onclick="document.getElementById('inpMat').click()" title="素材图（出现在画面中）">📎 素材
              <input type="file" id="inpMat" accept="image/*" multiple style="display:none" onchange="onInpFile(this,'mat')">
            </label>
            <div class="img-preview" id="inpPv"></div>
          </div>
          <textarea class="inp" id="chatInp" placeholder="输入描述，或输入修改意见继续生成..." rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}"></textarea>
          <div class="input-bottom">
            <select id="inpRatio"><option value="1:1">1:1</option><option value="3:4">3:4</option><option value="4:3">4:3</option><option value="9:16">9:16</option><option value="16:9">16:9</option></select>
            <span>${t.generating?'生成中...':''}</span>
          </div>
        </div>
        <button class="btn-send" id="sendBtn" onclick="sendChat()" ${t.generating?'disabled':''}>发送</button>
      </div>
    </div>`;

  // Set ratio from config
  const re = document.getElementById('inpRatio');
  if(re) re.value = cfg.ratio || '1:1';

  // Scroll to bottom
  setTimeout(()=>{
    const body=document.getElementById('chatBody');
    if(body) body.scrollTop=body.scrollHeight;
  },50);

  // Auto-focus
  setTimeout(()=>{const inp=document.getElementById('chatInp');if(inp&&!t.generating)inp.focus()},100);
}

// ===== Handlers =====
function pick(id){activeId=id;render()}

async function onInpFile(inp, type){
  const arr = type==='ref' ? pendingRefs : pendingMats;
  for(const f of inp.files){
    const d = await new Promise(r=>{const rd=new FileReader();rd.onload=e=>r(e.target.result);rd.readAsDataURL(f)});
    arr.push(await compress(d));
  }
  renderPending();
  inp.value='';
}

function renderPending(){
  const c=document.getElementById('inpPv');
  if(!c)return;
  const all = pendingRefs.map((img,i)=>({img,i,type:'ref'})).concat(pendingMats.map((img,i)=>({img,i,type:'mat'})));
  c.innerHTML = all.map(({img,i,type})=>`<div style="position:relative;display:inline-block">
    <img src="${img}" title="${type==='ref'?'参考图':'素材'}"><div class="rm" onclick="rmPending('${type}',${i})">×</div></div>`).join('');
}

function rmPending(type,idx){
  if(type==='ref') pendingRefs.splice(idx,1);
  else pendingMats.splice(idx,1);
  renderPending();
}

function sendChat(){
  const inp=document.getElementById('chatInp');
  const ratioEl=document.getElementById('inpRatio');
  if(!inp)return;
  const prompt=inp.value.trim();
  if(!prompt)return;
  if(ratioEl) cfg.ratio=ratioEl.value;

  const refs=[...pendingRefs], mats=[...pendingMats];
  pendingRefs=[];pendingMats=[];
  inp.value='';
  const pv=document.getElementById('inpPv');
  if(pv) pv.innerHTML='';

  sendMessage(activeId, prompt, refs, mats);
}

async function compress(b64){
  return new Promise(r=>{
    const img=new Image();
    img.onload=()=>{
      const cv=document.createElement('canvas');
      let w=img.width,h=img.height,mx=1024;
      if(w>mx||h>mx){if(w>h){h=h*mx/w;w=mx}else{w=w*mx/h;h=mx}}
      cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
      r(cv.toDataURL('image/jpeg',.85));
    };
    img.src=b64;
  });
}

function dlImg(url,fn){
  const a=document.createElement('a');a.href=url;a.download=`ai_${fn}.png`;
  document.body.appendChild(a);a.click();a.remove();
}

function openLB(url){
  const lb=document.getElementById('lb');
  document.getElementById('lbImg').src=url;
  lb.classList.add('a');
}

// ===== Settings =====
function openSet(){
  document.getElementById('sUrl').value=cfg.apiBaseUrl;
  document.getElementById('sKey').value=cfg.apiKey;
  document.getElementById('sVis').value=cfg.visionModel;
  document.getElementById('sQual').value=cfg.quality;
  document.getElementById('mo').classList.add('a');
}
function closeSet(){document.getElementById('mo').classList.remove('a')}
function saveSet(){
  cfg.apiBaseUrl=document.getElementById('sUrl').value.replace(/\/$/,'');
  cfg.apiKey=document.getElementById('sKey').value.trim();
  cfg.visionModel=document.getElementById('sVis').value;
  cfg.quality=document.getElementById('sQual').value;
  sCfg();closeSet();toast('已保存','ok');render();
}

// ===== Utils =====
function fmtTime(s){
  if(!s)return'';
  const d=new Date(s),n=new Date(),diff=n-d;
  if(diff<60000)return'刚刚';
  if(diff<3600000)return Math.floor(diff/60000)+'分前';
  if(diff<86400000)return Math.floor(diff/3600000)+'小时前';
  return`${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function esc(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function toast(msg,type=''){const c=document.getElementById('tc'),t=document.createElement('div');t.className=`tt ${type}`;t.textContent=msg;c.appendChild(t);setTimeout(()=>t.remove(),2500)}

// ===== Init =====
function init(){
  if(!tasks.length) activeId=null;
  else if(!activeId||!tasks.find(t=>t.id===activeId)) activeId=tasks[0].id;
  render();
  // Auto-scroll running tasks
  setInterval(()=>{
    const t=getActive();
    if(t&&t.generating) render();
  },3000);
}
init();
</script>
